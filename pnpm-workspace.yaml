allowBuilds:
  '@heroui/shared-utils': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@heroui/shared-utils"
  - "@parcel/watcher"
  - "@prisma/client"
  - "@prisma/engines"
  - "@swc/core"
  - esbuild
  - prisma
  - unrs-resolver

# Supply-chain hardening (#621):
# - Wait 24h (1440 min) before newly published npm versions can be resolved.
# - Block transitive dependencies from resolving via arbitrary git/tarball URLs.
minimumReleaseAge: 1440
blockExoticSubdeps: true

# HeroUI ile aynı @internationalized/date kopyasının kullanılması için tek sürüme sabitlenir
# (DatePicker tip uyumu: CalendarDate → DateValue nominal uyuşmazlığını önler).
overrides:
  "@internationalized/date": 3.12.4
  # GHSA-7589-6fvf-x4pw (ReDoS, effect <= 3.22.0): @hookform/resolvers ve prisma üzerinden gelir.
  effect: 3.22.4
  # #602: @workflowbuilder/sdk declares i18next ^24 itself. Force the single patched copy (deepExtend fix)
  # so the editor and sdk-i18n.ts share one default instance and the TR/DE editor strings keep working.
  i18next: 26.3.4
