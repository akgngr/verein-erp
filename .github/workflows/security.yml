# Hafif güvenlik kapısı: her push/PR'da sır taraması ve bağımlılık açıkları.
# Kapsamlı testler (SAST, DAST, yetki matrisi) için: docs/specs/TODO_SECURITY_TESTING.md

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # haftalık: yeni yayımlanan açıklar için
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      # Bulgular maskelenir (--redact); sır değeri loglara yazılmaz.
      - name: Scan full history
        run: /tmp/gitleaks git --redact --no-banner --exit-code 1 .

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Yalnız üretim bağımlılıkları; high/critical açık varsa kapı kapanır.
      - name: pnpm audit
        run: pnpm audit --prod --audit-level high
