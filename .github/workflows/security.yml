# Hafif güvenlik kapısı: her push/PR'da sır taraması ve bağımlılık açıkları.
# Kapsamlı testler (SAST, DAST, yetki matrisi) için: docs/specs/TODO_SECURITY_TESTING.md

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # haftalık: yeni yayımlanan açıklar için
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      # Bulgular maskelenir (--redact); sır değeri loglara yazılmaz.
      - name: Scan full history
        run: /tmp/gitleaks git --redact --no-banner --exit-code 1 .

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Bu iş paket kurmaz; setup-node v5'in otomatik pnpm önbelleği (packageManager alanı) olmayan
          # depo yolunu kaydetmeye çalışıp işi kırmızıya çeviriyordu.
          package-manager-cache: false
      # Yalnız üretim bağımlılıkları; high/critical açık varsa kapı kapanır.
      # Geçici istisna: GHSA-fc5q-39xc-vjpf (picomatch <= 4.0.7).
      # 2026-11-17 itibarıyla npm'de yamalı sürüm yok; upstream fix PR #254 açık.
      # İstisna 2026-12-15'te otomatik olarak sona erer; diğer advisory'ler etkilenmez.
      - name: pnpm audit
        run: |
          EXCEPTION_UNTIL="2026-12-15"
          TODAY="$(date -u +%F)"
          if [[ "$TODAY" > "$EXCEPTION_UNTIL" ]]; then
            echo "::error::Temporary picomatch audit exception expired on $EXCEPTION_UNTIL."
            exit 1
          fi
          pnpm audit --prod --audit-level high --ignore GHSA-fc5q-39xc-vjpf
