name: Temporary W0 docs regeneration

on:
  push:
    branches:
      - ui/w0-internal-release-notes
    paths:
      - .github/workflows/w0-refresh-catalog-temporary.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'akgngr/verein-erp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/w0-internal-release-notes
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:modules
      - name: Commit generated catalog only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/docs/kullanim/moduller
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate public module catalog for internal release filtering"
            git push origin HEAD:ui/w0-internal-release-notes
          fi
