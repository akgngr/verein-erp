# Dokümantasyon sitesi (Docusaurus, website/): PR'da derleme denetimi, main'de GitHub Pages yayını.
# Tek seferlik ayar: Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Docs

on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["website/**", "docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build # kırık bağlantıda durur
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
